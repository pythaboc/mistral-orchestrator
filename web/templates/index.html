<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Orchestrateur Mistral</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #16213e; padding: 12px 20px; border-bottom: 2px solid #0f3460; }
  header h1 { font-size: 18px; color: #e94560; }
  header .subtitle { font-size: 12px; color: #888; }
  .container { display: flex; flex: 1; overflow: hidden; }
  .chat-panel { flex: 2; display: flex; flex-direction: column; border-right: 1px solid #333; }
  .sidebar { flex: 1; overflow-y: auto; padding: 16px; background: #16213e; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; max-width: 85%; }
  .msg.user { background: #0f3460; margin-left: auto; }
  .msg.bot { background: #1a1a2e; border: 1px solid #333; }
  .msg .role { font-size: 11px; color: #888; margin-bottom: 4px; }
  .msg pre { background: #0d1117; padding: 8px; border-radius: 4px; overflow-x: auto; margin-top: 6px; font-size: 12px; }
  .input-area { padding: 12px; border-top: 1px solid #333; display: flex; gap: 8px; }
  .input-area input { flex: 1; padding: 10px; border: 1px solid #444; border-radius: 6px;
                      background: #0d1117; color: #e0e0e0; font-size: 14px; }
  .input-area button { padding: 10px 20px; border: none; border-radius: 6px;
                       background: #e94560; color: white; cursor: pointer; font-weight: bold; }
  .input-area button:disabled { background: #555; cursor: not-allowed; }
  .input-area .reset-btn { background: #333; }
  .section-title { font-size: 13px; color: #e94560; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .budget-bar { background: #0d1117; border-radius: 6px; height: 24px; overflow: hidden; margin-bottom: 6px; }
  .budget-fill { height: 100%; background: linear-gradient(90deg, #00b894, #e94560); transition: width 0.5s; }
  .budget-text { font-size: 12px; color: #aaa; }
  .agent-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid #222; }
  .agent-row .tokens { color: #e94560; font-weight: bold; }
  .agent-bar { background: #333; height: 6px; border-radius: 3px; margin: 2px 0 6px; overflow: hidden; }
  .agent-bar-fill { height: 100%; background: #00b894; }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .status-idle { background: #333; color: #888; }
  .status-running { background: #e94560; color: white; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .loading { color: #e94560; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>🤖 Orchestrateur d'équipe Mistral</h1>
  <div class="subtitle">Large 3 (orchestrateur) · Medium 3.5 (codeurs/vérif/chercheur) · Small (veilleur/scribe)</div>
</header>
<div class="container">
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="msg bot"><div class="role">Orchestrateur</div>Bonjour ! Décris une tâche et l'équipe s'en charge.</div>
    </div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Décris ta tâche..." onkeypress="if(event.key==='Enter')sendMsg()">
      <button class="reset-btn" onclick="resetConv()" title="Vider l'historique">🔄</button>
      <button id="sendBtn" onclick="sendMsg()">Envoyer</button>
    </div>
  </div>
  <div class="sidebar">
    <div class="section-title">📊 Budget mensuel</div>
    <div class="budget-bar"><div class="budget-fill" id="budgetFill" style="width:0%"></div></div>
    <div class="budget-text" id="budgetText">--</div>
    <div class="budget-text" id="dailyBudget" style="margin-top:4px"></div>
    <div style="margin-top:4px"><span class="status-badge status-idle" id="taskStatus">Inactif</span></div>

    <div class="section-title" style="margin-top:20px">🤖 Agents (session)</div>
    <div id="agentsList"><div class="budget-text">--</div></div>

    <div class="section-title" style="margin-top:20px">💬 Contexte</div>
    <div class="budget-text" id="ctxStats">--</div>
  </div>
</div>

<script>
async function fetchUsage() {
  try {
    const r = await fetch('/api/usage');
    const d = await r.json();
    const b = d.budget || {};
    const pct = b.pct_used || 0;
    document.getElementById('budgetFill').style.width = pct + '%';
    const used = (b.used_30d || 0).toLocaleString();
    const total = (b.monthly_budget || 0).toLocaleString();
    document.getElementById('budgetText').textContent = used + ' / ' + total + ' tokens (' + pct + '%)';
    const daily = (b.daily_budget || 0).toLocaleString();
    document.getElementById('dailyBudget').textContent = 'Budget du jour: ' + daily + ' tokens · Reste: ' + (b.usable_remaining||0).toLocaleString();
    const s = d.session || {};
    const byAgent = s.by_agent || {};
    const sessionTotal = s.total_tokens || 0;
    let html = '';
    const colors = {orchestrateur:'#e94560', chercheur:'#4fc3f7', codeur_1:'#00b894', codeur_2:'#00b894', verificateur:'#ffd54f', veilleur:'#ef5350', scribe:'#26c6da'};
    for (const [agent, tokens] of Object.entries(byAgent).sort((a,b)=>b[1]-a[1])) {
      const p = sessionTotal ? (tokens/sessionTotal*100) : 0;
      html += '<div class="agent-row"><span style="color:' + (colors[agent]||'#aaa') + '">' + agent + '</span><span class="tokens">' + tokens.toLocaleString() + '</span></div>';
      html += '<div class="agent-bar"><div class="agent-bar-fill" style="width:' + p + '%;background:' + (colors[agent]||'#888') + '"></div></div>';
    }
    document.getElementById('agentsList').innerHTML = html || '<div class="budget-text">Aucune consommation</div>';
    const c = d.conversation || {};
    document.getElementById('ctxStats').textContent = (c.message_count||0) + ' messages · ~' + (c.estimated_tokens||0).toLocaleString() + ' tokens' + (c.has_summary?' · résumé':'');
  } catch(e) { console.error(e); }
}

async function fetchStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const badge = document.getElementById('taskStatus');
    if (d.running) {
      badge.textContent = 'En cours : ' + (d.task||'').slice(0,40);
      badge.className = 'status-badge status-running';
    } else {
      badge.textContent = 'Inactif';
      badge.className = 'status-badge status-idle';
    }
    if (d.result && !d.result.fetched) {
      d.result.fetched = true;
      addMsg('bot', formatResult(d.result));
      document.getElementById('sendBtn').disabled = false;
      fetchUsage();
    }
  } catch(e) {}
}

function formatResult(r) {
  if (r.error) return '❌ Erreur : ' + r.error;
  let txt = '📋 Plan : ' + (r.plan||'').slice(0,200) + '\n\n';
  txt += '✅ Verdict : ' + ((r.verification||{}).verdict||'?') + ' (' + (r.iterations||0) + ' itération(s))\n\n';
  txt += '```\n' + (r.final_code||'') + '\n```';
  return txt;
}

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) return;
  addMsg('user', msg);
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  try {
    await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg})});
  } catch(e) { addMsg('bot', '❌ Erreur réseau'); }
}

function addMsg(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="role">' + (role==='user'?'Toi':'Orchestrateur') + '</div>' + content.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
  const messages = document.getElementById('messages');
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function resetConv() {
  await fetch('/api/reset', {method:'POST'});
  document.getElementById('messages').innerHTML = '<div class="msg bot"><div class="role">Orchestrateur</div>Conversation réinitialisée. Le journal est conservé.</div>';
  fetchUsage();
}

setInterval(fetchUsage, 3000);
setInterval(fetchStatus, 2000);
fetchUsage();
fetchStatus();
</script>
</body>
</html>
