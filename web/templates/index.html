<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🤖 Orchestrateur Mistral</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #1a1a2e; color: #e0e0e0; height: 100vh; height: 100dvh;
         display: flex; flex-direction: column; }
  header { background: #16213e; padding: 10px 16px; border-bottom: 2px solid #0f3460;
           flex-shrink: 0; }
  header h1 { font-size: 16px; color: #e94560; }
  header .subtitle { font-size: 11px; color: #888; }
  .container { display: flex; flex: 1; overflow: hidden; }
  .chat-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; min-width: 0; }
  .sidebar { width: 280px; overflow-y: auto; padding: 14px; background: #16213e; flex-shrink: 0; }
  .messages { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
  .msg { margin-bottom: 10px; padding: 10px 12px; border-radius: 10px; max-width: 88%;
         word-wrap: break-word; font-size: 14px; line-height: 1.4; }
  .msg.user { background: #0f3460; margin-left: auto; }
  .msg.bot { background: #1a1a2e; border: 1px solid #333; }
  .msg .role { font-size: 10px; color: #888; margin-bottom: 3px; }
  .msg pre { background: #0d1117; padding: 8px; border-radius: 6px; overflow-x: auto;
             margin-top: 6px; font-size: 12px; max-height: 300px; }
  .input-area { padding: 10px; border-top: 1px solid #333; display: flex; gap: 6px; flex-shrink: 0; }
  .input-area input { flex: 1; padding: 12px; border: 1px solid #444; border-radius: 8px;
                      background: #0d1117; color: #e0e0e0; font-size: 16px; }
  .input-area button { padding: 12px 16px; border: none; border-radius: 8px;
                       background: #e94560; color: white; cursor: pointer; font-weight: bold;
                       font-size: 14px; min-width: 44px; }
  .input-area button:disabled { background: #555; }
  .input-area .reset-btn { background: #333; }
  .section-title { font-size: 12px; color: #e94560; margin-bottom: 6px;
                   text-transform: uppercase; letter-spacing: 1px; }
  .budget-bar { background: #0d1117; border-radius: 6px; height: 22px; overflow: hidden; margin-bottom: 4px; }
  .budget-fill { height: 100%; background: linear-gradient(90deg, #00b894, #e94560); transition: width 0.5s; }
  .budget-text { font-size: 11px; color: #aaa; }
  .agent-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; border-bottom: 1px solid #222; }
  .agent-row .tokens { color: #e94560; font-weight: bold; }
  .agent-bar { background: #333; height: 5px; border-radius: 3px; margin: 2px 0 5px; overflow: hidden; }
  .agent-bar-fill { height: 100%; background: #00b894; }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; }
  .status-idle { background: #333; color: #888; }
  .status-running { background: #e94560; color: white; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .loading { color: #e94560; font-style: italic; }
  .pending-action { background: #3d1f0f; border: 1px solid #e94560; border-radius: 8px;
                    padding: 10px; margin-bottom: 8px; }
  .pending-action .btn-approve { background: #00b894; padding: 8px 12px; border: none;
                                  border-radius: 6px; color: white; cursor: pointer; margin-right: 6px; }
  .pending-action .btn-reject { background: #ef5350; padding: 8px 12px; border: none;
                                 border-radius: 6px; color: white; cursor: pointer; }
  .guardrail-warn { background: #3d2f0f; border-left: 3px solid #ffd54f; padding: 6px 10px;
                    margin: 4px 0; font-size: 12px; border-radius: 4px; }
  .tab-bar { display: flex; background: #16213e; border-bottom: 1px solid #333; flex-shrink: 0; }
  .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #888; font-size: 13px; }
  .tab.active { color: #e94560; border-bottom: 2px solid #e94560; }
  @media (max-width: 768px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; max-height: 40vh; border-right: none; border-top: 1px solid #333; }
    .chat-panel { border-right: none; }
  }
</style>
</head>
<body>
<header>
  <h1>🤖 Orchestrateur Mistral</h1>
  <div class="subtitle">Large 3 · Medium 3.5 · Small | <span id="budgetPct">--</span></div>
</header>
<div class="container">
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="msg bot"><div class="role">Orchestrateur</div>Bonjour ! Décris une tâche et l'équipe s'en charge.</div>
    </div>
    <div id="pendingActions"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Décris ta tâche..." onkeypress="if(event.key==='Enter')sendMsg()">
      <button class="reset-btn" onclick="resetConv()" title="Reset">🔄</button>
      <button id="sendBtn" onclick="sendMsg()">➤</button>
    </div>
  </div>
  <div class="sidebar">
    <div class="section-title">📊 Budget mensuel</div>
    <div class="budget-bar"><div class="budget-fill" id="budgetFill" style="width:0%"></div></div>
    <div class="budget-text" id="budgetText">--</div>
    <div class="budget-text" id="dailyBudget" style="margin-top:3px"></div>
    <div style="margin-top:4px"><span class="status-badge status-idle" id="taskStatus">Inactif</span></div>

    <div class="section-title" style="margin-top:16px">🤖 Agents (session)</div>
    <div id="agentsList"><div class="budget-text">--</div></div>

    <div class="section-title" style="margin-top:16px">💬 Contexte</div>
    <div class="budget-text" id="ctxStats">--</div>

    <div class="section-title" style="margin-top:16px">🤖 Agents</div>
    <div id="agentsStatus"><div class="budget-text">--</div></div>

    <div class="section-title" style="margin-top:16px">📝 Traces récentes</div>
    <div id="tracesList" style="font-size:11px;max-height:150px;overflow-y:auto"><div class="budget-text">--</div></div>
  </div>
</div>

<script>
async function fetchUsage() {
  try {
    const r = await fetch('/api/usage');
    const d = await r.json();
    const b = d.budget || {};
    const pct = b.pct_used || 0;
    document.getElementById('budgetFill').style.width = pct + '%';
    document.getElementById('budgetPct').textContent = pct + '% utilisé';
    document.getElementById('budgetText').textContent = (b.used_30d||0).toLocaleString() + ' / ' + (b.monthly_budget||0).toLocaleString();
    document.getElementById('dailyBudget').textContent = 'Jour: ' + (b.daily_budget||0).toLocaleString() + ' | Reste: ' + (b.usable_remaining||0).toLocaleString();
    const s = d.session || {};
    const byAgent = s.by_agent || {};
    const sessionTotal = s.total_tokens || 0;
    let html = '';
    const colors = {orchestrateur:'#e94560', chercheur:'#4fc3f7', codeur_1:'#00b894', codeur_2:'#00b894', verificateur:'#ffd54f', veilleur:'#ef5350', scribe:'#26c6da'};
    for (const [agent, tokens] of Object.entries(byAgent).sort((a,b)=>b[1]-a[1])) {
      const p = sessionTotal ? (tokens/sessionTotal*100) : 0;
      html += '<div class="agent-row"><span style="color:'+(colors[agent]||'#aaa')+'">'+agent+'</span><span class="tokens">'+tokens.toLocaleString()+'</span></div>';
      html += '<div class="agent-bar"><div class="agent-bar-fill" style="width:'+p+'%;background:'+(colors[agent]||'#888')+'"></div></div>';
    }
    document.getElementById('agentsList').innerHTML = html || '<div class="budget-text">--</div>';
    const c = d.conversation || {};
    document.getElementById('ctxStats').textContent = (c.message_count||0)+' msg · ~'+(c.estimated_tokens||0).toLocaleString()+' tokens'+(c.has_summary?' · résumé':'');
  } catch(e) {}
}

var _resultDisplayed = false;
async function fetchStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const badge = document.getElementById('taskStatus');
    if (d.running) { badge.textContent='En cours'; badge.className='status-badge status-running'; _resultDisplayed=false; }
    else { badge.textContent='Inactif'; badge.className='status-badge status-idle'; }
    if (d.result && !_resultDisplayed) {
      _resultDisplayed = true;
      addMsg('bot', formatResult(d.result));
      document.getElementById('sendBtn').disabled = false;
      fetchUsage();
    }
  } catch(e) {}
}

async function fetchPending() {
  try {
    const r = await fetch('/api/pending');
    const d = await r.json();
    const list = d.pending || [];
    let html = '';
    for (const a of list) {
      html += '<div class="pending-action"><div style="font-size:13px;margin-bottom:6px">⚠️ '+a.description+'</div>';
      html += '<button class="btn-approve" onclick="approveAction(\''+a.id+'\',true)">✓ Approuver</button>';
      html += '<button class="btn-reject" onclick="approveAction(\''+a.id+'\',false)">✗ Refuser</button></div>';
    }
    document.getElementById('pendingActions').innerHTML = html;
  } catch(e) {}
}

async function fetchTraces() {
  try {
    const r = await fetch('/api/traces?limit=10');
    const d = await r.json();
    const traces = d.traces || [];
    if (!traces.length) { document.getElementById('tracesList').innerHTML='<div class="budget-text">--</div>'; return; }
    let html = '';
    for (const t of traces.slice(-10).reverse()) {
      const time = (t.timestamp||'').slice(11,19);
      const tokens = t.total_tokens||0;
      const cache = t.from_cache?' (cache)':'';
      const err = t.error?' ⚠️':'';
      html += '<div style="color:#888">'+time+' '+t.agent+' ['+t.model+'] '+tokens+'tk'+cache+err+'</div>';
    }
    document.getElementById('tracesList').innerHTML = html;
  } catch(e) {}
}

function formatResult(r) {
  if (r.error) return '❌ Erreur : ' + r.error;
  var type = r.task_type || 'code';
  if (type === 'clarification') {
    return '❓ ' + (r.answer||'') + '\n\n_(Réponds pour que je puisse procéder)_';
  }
  if (type === 'research' || type === 'info') {
    var txt = '🔍 Résultat de recherche :\n\n' + (r.answer||'(pas de réponse)');
    var sources = (r.research||{}).sources || [];
    if (sources.length) {
      txt += '\n\n📚 Sources :';
      for (var i=0; i<Math.min(sources.length,5); i++) {
        txt += '\n• ' + (sources[i].title||'').slice(0,60) + ' — ' + sources[i].url;
      }
    }
    return txt;
  }
  if (type === 'chat') {
    return '💬 ' + (r.answer||'');
  }
  // code
  var txt = '📋 Plan : ' + (r.plan||'').slice(0,200) + '\n\n';
  txt += '✅ Verdict : ' + ((r.verification||{}).verdict||'?') + ' (' + (r.iterations||0) + ' itération(s))\n\n';
  txt += '```\n' + (r.final_code||'') + '\n```';
  return txt;
}

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) return;
  addMsg('user', msg);
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  try {
    await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg})});
  } catch(e) { addMsg('bot', '❌ Erreur réseau'); }
}

function addMsg(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="role">'+(role==='user'?'Toi':'Orchestrateur')+'</div>'+content.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
  const messages = document.getElementById('messages');
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function resetConv() {
  await fetch('/api/reset', {method:'POST'});
  document.getElementById('messages').innerHTML = '<div class="msg bot"><div class="role">Orchestrateur</div>Conversation réinitialisée.</div>';
  fetchUsage();
}

async function approveAction(id, approved) {
  await fetch('/api/approve', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action_id:id, approved:approved})});
  fetchPending();
}

async function fetchAgents() {
  try {
    const r = await fetch('/api/agents');
    const d = await r.json();
    const agents = d.agents || [];
    if (!agents.length) { document.getElementById('agentsStatus').innerHTML='<div class="budget-text">--</div>'; return; }
    const colors = {orchestrateur:'#e94560', chercheur:'#4fc3f7', codeur_1:'#00b894', codeur_2:'#00b894', verificateur:'#ffd54f', veilleur:'#ef5350', scribe:'#26c6da'};
    let html = '';
    for (const a of agents) {
      var dot = a.busy?'🟢':(a.tokens>0?'⚪':'⚫');
      var task = a.busy && a.task ? '<div style="font-size:10px;color:#888;padding-left:20px">→ '+a.task.slice(0,50)+'</div>' : '';
      var dur = a.busy && a.duration ? ' ('+a.duration+'s)' : '';
      html += '<div class="agent-row"><span style="color:'+(colors[a.name]||'#aaa')+'">'+dot+' '+a.name+dur+'</span><span class="tokens">'+a.tokens.toLocaleString()+'tk</span></div>';
      html += '<div class="budget-text" style="padding-left:12px;font-size:10px">'+a.role+' · '+a.model+'</div>';
      html += task;
    }
    document.getElementById('agentsStatus').innerHTML = html;
  } catch(e) {}
}
setInterval(fetchUsage, 3000);
setInterval(fetchStatus, 2000);
setInterval(fetchPending, 4000);
setInterval(fetchTraces, 5000);
setInterval(fetchAgents, 3000);
fetchUsage(); fetchStatus(); fetchPending(); fetchTraces(); fetchAgents();
</script>
</body>
</html>
